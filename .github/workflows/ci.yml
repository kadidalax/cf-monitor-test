name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, test and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: npm ci

      # Both packages type-check here: frontend runs `tsc --noEmit`,
      # worker runs `wrangler types --check && tsc --noEmit`.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # `npm test` chains test:js (node --test across the repo)
      # and test:go. The gate is the exit code -- never the output line count:
      # node --test prints per-file for top-level bare assertions and per-test for
      # test() files, so counting lines silently misses whole files.
      - name: Test
        run: npm test

      # These fixtures drop to nobody to check real filesystem access.
      # Their service commands are isolated; the normal runner skips them.
      - name: Installer service account permissions
        run: |
          sudo "$(command -v node)" --test --test-name-pattern='^compat (systemd|openrc) (default paths|must not open permissions)' agent/install-compat.test.mjs
          sudo "$(command -v node)" --test --test-name-pattern='^native ' agent/disk-collector-install.test.mjs

      - name: Agent root collector permissions
        working-directory: agent
        run: |
          go test -c -o "$RUNNER_TEMP/cf-monitor-agent-native.test" .
          sudo sh -s -- "$RUNNER_TEMP/cf-monitor-agent-native.test" <<'NATIVE'
          set -eu
          native_dir="$(mktemp -d /run/cf-monitor-agent-native.XXXXXX)"
          cleanup() {
            native_status=$?
            trap - EXIT HUP INT TERM
            case "$native_dir" in /run/cf-monitor-agent-native.??????) ;; *) exit 98 ;; esac
            [ "$(readlink -f -- "$native_dir")" = "$native_dir" ] || exit 99
            rm -rf -- "$native_dir"
            exit "$native_status"
          }
          trap cleanup EXIT HUP INT TERM
          chmod 0755 "$native_dir"
          install -m 0755 "$1" "$native_dir/agent.test"
          mkdir -m 0755 "$native_dir/tmp"
          TMPDIR="$native_dir/tmp" "$native_dir/agent.test" -test.run '^TestDirectoryDiskNative' -test.v
          NATIVE

      - name: Agent data race check
        working-directory: agent
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

      - name: Dependency and toolchain security
        run: npm run security:check

      - name: Check migration drift
        run: |
          npm run build:migrations
          git diff --exit-code -- supabase/ worker/src/generated/

  native-smoke:
    name: Native Agent on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Native Go tests and executable startup
        shell: bash
        working-directory: agent
        run: |
          set -euo pipefail
          go test ./...
          output="${RUNNER_TEMP}/cf-monitor-smoke"
          if [ "$RUNNER_OS" = Windows ]; then output="${output}.exe"; fi
          go build -trimpath -o "$output" .
          "$output" -h
      - name: Native Windows install, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-windows-installer.ps1

  freebsd-smoke:
    name: Native Agent on FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Native FreeBSD tests and executable startup
        uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1
        with:
          release: '14.5'
          prepare: pkg install -y go
          run: |
            set -eu
            cd agent
            go test ./...
            smoke_dir="$(mktemp -d /tmp/cf-monitor-smoke.XXXXXX)"
            trap 'rm -f "$smoke_dir/agent"; rmdir "$smoke_dir"' EXIT
            go build -trimpath -o "$smoke_dir/agent" .
            "$smoke_dir/agent" -h
