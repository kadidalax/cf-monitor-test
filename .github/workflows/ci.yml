name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --redact --verbose --log-opts="HEAD" --gitleaks-ignore-path=/repo/.gitleaksignore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Verify Cloudflare Worker bundle
        run: npm run verify:cloudflare

      - name: Audit frontend production dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Audit Worker production dependencies
        run: npm --prefix worker audit --omit=dev --audit-level=high
