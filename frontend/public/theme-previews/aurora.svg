<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Aurora medium-load node card preview">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0f5"/>
      <stop offset=".36" stop-color="#ffe4e1"/>
      <stop offset=".7" stop-color="#e6e6fa"/>
      <stop offset="1" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset=".48" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".25"/>
    </linearGradient>
    <filter id="aurora" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1f2687" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#page)"/>
  <g filter="url(#aurora)">
    <ellipse cx="120" cy="20" rx="250" ry="180" fill="#ff6b9d" fill-opacity=".55"/>
    <ellipse cx="860" cy="60" rx="230" ry="170" fill="#7b61ff" fill-opacity=".45"/>
    <ellipse cx="600" cy="520" rx="260" ry="160" fill="#67e8f9" fill-opacity=".42"/>
  </g>

  <g filter="url(#glow)">
    <rect x="146" y="74" width="668" height="392" rx="18" fill="#ffffff" fill-opacity=".44" stroke="#ffffff" stroke-opacity=".62"/>
  </g>
  <rect x="163" y="75" width="634" height="1.5" fill="url(#edge)"/>

  <g transform="translate(178 108)" font-family="Inter, Arial, sans-serif">
    <text x="0" y="26" fill="#1e1b4b" font-size="25" font-weight="850">Reykjavik-Edge</text>
    <text x="0" y="52" fill="#4c46a8" font-size="15">冰岛 / Debian 12 / Linux 6.8</text>
    <rect x="510" y="6" width="76" height="30" rx="15" fill="url(#mark)"/>
    <text x="548" y="26" text-anchor="middle" fill="#fff" font-size="14" font-weight="850">在线</text>
  </g>

  <g transform="translate(178 188)" font-family="Inter, Arial, sans-serif">
    <g>
      <rect width="178" height="92" rx="14" fill="#ffffff" fill-opacity=".30" stroke="#ffffff" stroke-opacity=".55"/>
      <rect x="14" y="1" width="150" height="1" fill="#ffffff" fill-opacity=".8"/>
      <text x="18" y="30" fill="#4c46a8" font-size="14" font-weight="850">CPU</text>
      <text x="18" y="64" fill="#1e1b4b" font-size="28" font-weight="850">54%</text>
      <rect x="18" y="74" width="142" height="8" rx="4" fill="#ffffff" fill-opacity=".55"/>
      <rect x="18" y="74" width="77" height="8" rx="4" fill="url(#bar)"/>
    </g>
    <g transform="translate(206 0)">
      <rect width="178" height="92" rx="14" fill="#ffffff" fill-opacity=".30" stroke="#ffffff" stroke-opacity=".55"/>
      <rect x="14" y="1" width="150" height="1" fill="#ffffff" fill-opacity=".8"/>
      <text x="18" y="30" fill="#4c46a8" font-size="14" font-weight="850">内存</text>
      <text x="18" y="64" fill="#1e1b4b" font-size="28" font-weight="850">62%</text>
      <rect x="18" y="74" width="142" height="8" rx="4" fill="#ffffff" fill-opacity=".55"/>
      <rect x="18" y="74" width="88" height="8" rx="4" fill="url(#bar)"/>
    </g>
    <g transform="translate(412 0)">
      <rect width="178" height="92" rx="14" fill="#ffffff" fill-opacity=".30" stroke="#ffffff" stroke-opacity=".55"/>
      <rect x="14" y="1" width="150" height="1" fill="#ffffff" fill-opacity=".8"/>
      <text x="18" y="30" fill="#4c46a8" font-size="14" font-weight="850">磁盘</text>
      <text x="18" y="64" fill="#1e1b4b" font-size="28" font-weight="850">58%</text>
      <rect x="18" y="74" width="142" height="8" rx="4" fill="#ffffff" fill-opacity=".55"/>
      <rect x="18" y="74" width="82" height="8" rx="4" fill="url(#bar)"/>
    </g>
  </g>

  <g transform="translate(178 312)" font-family="Inter, Arial, sans-serif">
    <rect width="590" height="86" rx="14" fill="#ffffff" fill-opacity=".30" stroke="#ffffff" stroke-opacity=".55"/>
    <rect x="16" y="1" width="558" height="1" fill="#ffffff" fill-opacity=".8"/>
    <text x="20" y="34" fill="#4c46a8" font-size="15" font-weight="850">网络速率</text>
    <text x="160" y="34" fill="#7e22ce" font-size="16" font-weight="850">上行 18.4 MB/s</text>
    <text x="342" y="34" fill="#0e7490" font-size="16" font-weight="850">下行 42.7 MB/s</text>
    <text x="20" y="66" fill="#4c46a8" font-size="15" font-weight="850">总流量</text>
    <text x="160" y="66" fill="#7e22ce" font-size="16" font-weight="850">上传 1.2 TB</text>
    <text x="342" y="66" fill="#0e7490" font-size="16" font-weight="850">下载 3.8 TB</text>
  </g>
</svg>
